name: Deploy to GitHub Pages

on:
  push:
    # The repository's default branch has been called both of these over time,
    # so accept either rather than forcing a rename.
    branches: [main, master]
  # Allows a manual re-deploy from the Actions tab.
  workflow_dispatch:

# Required by actions/deploy-pages: read the repo, write the Pages artefact,
# and mint an OIDC token for the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; keep the newest and cancel stale runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
